<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1D36" />
  <meta name="description" content="SCaD Comunidad · Conexión, organización y participación" />
  <title>SCaD Comunidad</title>
  <link rel="icon" type="image/png" href="img/scad_comunidad_favicon.png" />
  <link rel="apple-touch-icon" href="img/icon_scad_comunidad_192.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#inicio" aria-label="SCaD Comunidad">
        <img src="img/logo_scad_comunidad.png" alt="SCaD Comunidad" />
      </a>

      <button class="identity-button" id="identityButton" type="button" aria-expanded="false" aria-label="Abrir perfil">
        <span class="avatar">JD</span>
        <span class="identity-copy">
          <strong>Usuario Demo</strong>
          <small>Comunidad Central</small>
        </span>
        <span class="chevron">⌄</span>
      </button>

      <div class="identity-menu" id="identityMenu" hidden>
        <div class="identity-menu-head">
          <span class="avatar avatar-large">JD</span>
          <div>
            <strong>Usuario Demo</strong>
            <small>Miembro activo</small>
          </div>
        </div>
        <button type="button" data-route="perfil">Mi perfil</button>
        <button type="button">Cerrar sesión</button>
      </div>
    </header>

    <main id="inicio">
      <section class="home-top" aria-label="Inicio de comunidad">
        <article class="community-card">
          <div class="community-logo" aria-label="Logotipo de la comunidad">CC</div>
          <div class="community-card-copy">
            <small>MI COMUNIDAD</small>
            <strong>Comunidad Central</strong>
            <span>Miembro activo</span>
          </div>
          <button class="community-info-button" id="communityInfoButton" type="button">+ Info</button>
        </article>

        <article class="tv-monitor">
          <div class="tv-screen" id="tvScreen">
            <div class="tv-screen-bg"></div>
            <div class="tv-live-badge"><span></span> EN VIVO</div>
            <div class="tv-screen-center">
              <span class="tv-play">▶</span>
            </div>
          </div>
          <div class="tv-controls">
            <select id="tvChannelSelect" aria-label="Cambiar canal">
              <option value="tvdi">TV Digital Internet</option>
              <option value="comunidad">Canal Comunidad</option>
            </select>
            <button class="tv-icon-button" id="tvMuteButton" type="button" aria-label="Activar sonido" title="Activar sonido"><span id="tvMuteIcon">🔇</span></button>
            <button class="tv-icon-button" id="tvFullscreenButton" type="button" aria-label="Ampliar a pantalla completa" title="Pantalla completa">⛶</button>
          </div>
        </article>
      </section>

      <section class="section-block" aria-labelledby="modulesTitle">
        <div class="section-heading">
          <div>
            <span class="eyebrow">MÓDULOS</span>
            <h2 id="modulesTitle">¿Qué quieres consultar?</h2>
          </div>
        </div>

        <div class="module-grid">
          <button class="module-card module-programacion" data-module="programacion" type="button">
            <span class="module-icon" aria-hidden="true">◷</span>
            <span class="module-content"><strong>Programación</strong><small>Actividades, eventos y agenda</small></span>
            <span class="module-meta">3 próximos</span>
          </button>

          <button class="module-card module-mensajeria" data-module="mensajeria" type="button">
            <span class="module-icon" aria-hidden="true">✉</span>
            <span class="module-content"><strong>Mensajería</strong><small>Conversaciones, avisos y comunicación</small></span>
            <span class="module-meta alert">2 nuevos</span>
          </button>

          <button class="module-card module-capacitacion" data-module="capacitacion" type="button">
            <span class="module-icon" aria-hidden="true">▤</span>
            <span class="module-content"><strong>Capacitación</strong><small>Contenidos y aprendizaje</small></span>
            <span class="module-meta">1 pendiente</span>
          </button>

          <button class="module-card module-documentacion" data-module="documentacion" type="button">
            <span class="module-icon" aria-hidden="true">▣</span>
            <span class="module-content"><strong>Documentación</strong><small>Reglamentos, guías y archivos</small></span>
            <span class="module-meta">Consulta</span>
          </button>
        </div>
      </section>

      <section class="dashboard-grid">
        <article class="panel agenda-panel">
          <div class="panel-heading"><div><span class="eyebrow">AGENDA</span><h2>Próximas actividades</h2></div><button class="text-button" data-module="programacion" type="button">Ver todas</button></div>
          <div class="timeline">
            <button class="event-row" data-module="programacion" type="button"><time datetime="2026-09-03"><strong>03</strong><span>SEP</span></time><span class="event-info"><small>18:00 · ACTIVIDAD GENERAL</small><strong>Reunión general</strong><span>Punto de reunión principal</span></span><span class="row-arrow">›</span></button>
            <button class="event-row" data-module="programacion" type="button"><time datetime="2026-09-06"><strong>06</strong><span>SEP</span></time><span class="event-info"><small>09:00 · COMUNIDAD</small><strong>Jornada comunitaria</strong><span>Área común</span></span><span class="row-arrow">›</span></button>
            <button class="event-row" data-module="programacion" type="button"><time datetime="2026-09-12"><strong>12</strong><span>SEP</span></time><span class="event-info"><small>17:30 · FORMACIÓN</small><strong>Sesión informativa</strong><span>Sala principal</span></span><span class="row-arrow">›</span></button>
          </div>
        </article>

        <article class="panel notices-panel">
          <div class="panel-heading"><div><span class="eyebrow">AVISOS</span><h2>Para ti</h2></div></div>
          <button class="notice" data-module="mensajeria" type="button"><span class="notice-dot"></span><span><strong>Nuevo mensaje de administración</strong><small>Hace 18 min</small></span></button>
          <button class="notice" data-module="capacitacion" type="button"><span class="notice-dot soft"></span><span><strong>Tienes contenido pendiente</strong><small>Capacitación</small></span></button>
          <button class="notice" data-module="programacion" type="button"><span class="notice-dot soft"></span><span><strong>Actividad confirmada</strong><small>3 de septiembre · 18:00</small></span></button>
        </article>
      </section>

      <footer class="app-footer"><span>SCaD Comunidad · v0.2.2</span><span>Conexión · Organización · Participación</span></footer>
    </main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-item active" data-route="inicio" type="button"><span>⌂</span><small>Inicio</small></button>
      <button class="nav-item" data-module="programacion" type="button"><span>◷</span><small>Agenda</small></button>
      <button class="nav-item" data-module="mensajeria" type="button"><span>✉</span><small>Mensajes</small><b>2</b></button>
      <button class="nav-item" data-route="perfil" type="button"><span>○</span><small>Perfil</small></button>
    </nav>
  </div>

  <div class="modal-backdrop" id="moduleModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" type="button" aria-label="Cerrar">×</button>
      <span class="modal-kicker" id="modalKicker">PROTOTIPO</span>
      <h2 id="modalTitle">Módulo</h2>
      <p id="modalDescription"></p>
      <div id="modalContent" class="modal-content"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
