<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1D36" />
  <meta name="description" content="SCaD Comunidad · Conexión, organización y participación" />
  <title>SCaD Comunidad</title>
  <link rel="icon" type="image/png" href="img/scad_comunidad_favicon.png" />
  <link rel="apple-touch-icon" href="img/icon_scad_comunidad_192.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css?v=0.3.29" />
  <link rel="stylesheet" href="install.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#inicio" aria-label="SCaD Comunidad"><img src="img/logo_scad_comunidad.png" alt="SCaD Comunidad" /></a>
      <div class="topbar-actions">
        <button class="install-button" id="installAppButton" type="button">Instalar app</button>
        <button class="identity-button" id="identityButton" type="button" aria-expanded="false" aria-label="Abrir perfil">
          <span class="avatar" id="identityAvatar">···</span>
          <span class="identity-copy"><strong id="identityName">Conectando…</strong></span><span class="chevron">⌄</span>
        </button>
      </div>
      <div class="identity-menu" id="identityMenu" hidden>
        <div class="identity-menu-head"><span class="avatar avatar-large" id="menuAvatar">···</span><div><strong id="menuName">Usuario</strong><small id="menuEmail">—</small></div></div>
        <button type="button" id="editProfileButton">Editar perfil</button>
        <button type="button" id="subscriptionsButton">Mis suscripciones</button>
        <button class="admin-panel-link" type="button" id="adminPanelButton" hidden><span aria-hidden="true">⚙</span> Panel de Administración</button>
        <button type="button" id="logoutButton">Cerrar sesión</button>
      </div>
    </header>

    <main id="inicio">
      <section class="home-top tv-home" aria-label="Inicio de comunidad">
        <div class="home-label home-label-community">Mi comunidad</div>
        <article class="community-card"><div class="community-logo" id="communityLogo">SC</div><div class="community-card-copy"><strong id="communityName">SCaD Comunidad</strong><button class="community-info-button" id="communityInfoButton" type="button">+ Info</button></div></article>
        <section class="tv-section" aria-label="Canal Comunidad">
    <div class="tv-console">
      <div id="tvMonitor" class="tv-monitor">
        <video id="tvVideo" autoplay muted playsinline preload="auto" aria-label="Canal en vivo"></video>
        <div id="tvPlaceholder" class="tv-placeholder"></div>
        <div id="tvScreenCenter" class="tv-screen-center"><span class="tv-play">▶</span></div>
        <div id="tvLoadIndicator" class="tv-load-indicator" role="status" aria-live="polite" hidden><span id="tvLoadText"></span><span class="tv-load-line" aria-hidden="true"></span></div>
        <div class="tv-caption"><div class="tv-channel-heading"><strong id="tvChannelNumber">CH 00</strong><span id="tvNowLabel" class="tv-now">Canal Comunidad</span></div><small id="tvContentTitle"></small></div>
      </div>
      <button id="tvResume" class="tv-resume" type="button" hidden>▶ Reproducir</button>
      <div class="tv-bar">
        <button id="btnTvMute" class="tv-toolbar-button" type="button" aria-label="Activar sonido"><span id="tvMuteIcon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg></span><span id="tvMuteText" class="tv-sr-only">Activar sonido</span></button>
        <button id="btnTvOptions" class="tv-toolbar-button tv-channel-trigger" type="button" aria-label="Elegir canal" aria-controls="tvOptions" aria-expanded="false"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="m8 2 4 4 4-4"/></svg><span>Canales</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <button id="btnTvExpand" class="tv-toolbar-button" type="button" aria-label="Ampliar monitor"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div id="tvFsLayer" class="tv-fs-layer" hidden><button id="btnCloseTvFs" class="tv-fs-close" type="button" aria-label="Salir de pantalla completa">×</button></div>
      <div id="tvOptions" class="tv-controls tv-options" role="dialog" aria-label="Elegir canal" hidden>
        <div class="tv-options-head"><strong>Canales</strong><button id="btnTvOptionsClose" class="tv-options-close" type="button" aria-label="Cerrar canales">×</button></div>
        <div class="tv-channels" id="tvChannelList"></div>
      </div>
    </div>
  </section>
        <div class="community-subline"></div>
      </section>

      <section class="section-block" aria-label="Módulos disponibles"><div class="module-grid">
        <button class="module-card module-programacion" data-module="programacion" type="button"><span class="module-icon" role="img" aria-label="Calendario">📅</span><span class="module-content"><strong>Programación</strong><small>Actividades, eventos y agenda</small></span><span class="module-new-count" id="programacionNewCount" hidden aria-label="Actividades nuevas"></span></button>
        <button class="module-card module-mensajeria" data-module="mensajeria" type="button"><span class="module-icon" role="img" aria-label="Chat">💬</span><span class="module-content"><strong>Mensajería</strong><small>Conversaciones, avisos y comunicación</small></span></button>
        <button class="module-card module-capacitacion" data-module="capacitacion" type="button"><span class="module-icon" role="img" aria-label="Libro abierto">📖</span><span class="module-content"><strong>Capacitación</strong><small>Mis Cursos</small></span></button>
        <button class="module-card module-documentacion" data-module="documentacion" type="button"><span class="module-icon" role="img" aria-label="Documento">📄</span><span class="module-content"><strong>Documentación</strong><small>Reglamentos, guías y archivos</small></span></button>
      </div></section>

      <section class="dashboard-grid">
        <article class="panel agenda-panel"><div class="panel-heading"><div><span class="eyebrow">AGENDA</span><h2>Próximas actividades</h2></div><button class="text-button" data-module="programacion" type="button">Ver todas</button></div><div class="timeline" id="agendaTimeline"><div class="prototype-row"><strong>Cargando agenda…</strong></div></div></article>
      </section>
      <footer class="app-footer"><span>SCaD Comunidad · v0.3.29</span><span>Conexión · Organización · Participación</span><span class="auth-chain" id="authChain">Se? · Eo? · Us? · Pr? · Co? · Ad?</span></footer>
    </main>

    <nav class="bottom-nav" aria-label="Navegación principal"><button class="nav-item active" data-route="inicio" type="button"><span>⌂</span><small>Inicio</small></button><button class="nav-item" data-module="programacion" type="button"><span>◷</span><small>Agenda</small></button><button class="nav-item" data-module="mensajeria" type="button"><span>✉</span><small>Mensajes</small></button><button class="nav-item" data-route="perfil" type="button"><span>○</span><small>Perfil</small></button></nav>
  </div>

  <div class="modal-backdrop" id="moduleModal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="modalClose" type="button" aria-label="Cerrar">×</button><span class="modal-kicker" id="modalKicker">SCaD COMUNIDAD</span><h2 id="modalTitle">Módulo</h2><p id="modalDescription"></p><div id="modalContent" class="modal-content"></div></section></div>

  <div class="ios-tutorial-backdrop" id="iosTutorialModal" hidden>
    <section class="ios-tutorial-dialog" role="dialog" aria-modal="true" aria-labelledby="iosTutorialTitle">
      <button class="ios-tutorial-close" id="iosTutorialClose" type="button" aria-label="Cerrar">×</button>
      <h2 id="iosTutorialTitle">Instalar SCaD Comunidad en iPhone</h2>
      <video class="ios-tutorial-video" id="iosTutorialVideo" controls playsinline preload="metadata">
        <source src="img/iphone-install.mp4" type="video/mp4" />
      </video>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="app.js?v=0.3.29"></script>
  <script src="install.js"></script>
  <script src="admin.js"></script>
</body>
</html>
