<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mensajería · SCaD MNS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}
iframe{display:block;width:100%;height:100%;border:0;background:#f4f7fb}
</style>
</head>
<body>
<iframe id="mnsCore" src="https://cpc.scad.mx/mns-frontend.html?v=0.5.9" title="Mensajería"></iframe>
<script>
(()=>{
'use strict';
const frame=document.getElementById('mnsCore');
const parentOrigin=location.origin;
const coreOrigin='https://cpc.scad.mx';
window.addEventListener('message',event=>{
  if(event.source===frame.contentWindow&&event.origin===coreOrigin){
    parent.postMessage(event.data,parentOrigin);
    return;
  }
  if(event.source===parent&&event.origin===parentOrigin){
    frame.contentWindow?.postMessage(event.data,coreOrigin);
  }
});
})();
</script>
</body>
</html>
