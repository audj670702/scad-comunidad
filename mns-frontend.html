<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mensajería · SCaD MNS</title><style>:root{--bg:#f6f8fb;--surface:#fff;--ink:#0d2342;--muted:#5e7391;--line:#dce5ef;--blue:#0e67d7;--red:#ef1b23}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea{font:inherit}.shell{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.top{height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}.top strong{font-size:18px}.top small{margin-left:auto;color:var(--muted);font-size:9px}.close{border:0;background:transparent;font-size:25px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-bottom:1px solid var(--line)}.tab{height:52px;border:0;background:#fff;font-weight:800;font-size:10px;color:var(--ink)}.tab.active{color:var(--blue);border-bottom:3px solid var(--blue)}.toolbar{display:flex;gap:7px;padding:9px 10px;background:#fff}.toolbar input{flex:1;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 11px}.list{flex:1;overflow:auto;background:#fff}.row{width:100%;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;border:0;border-bottom:1px solid #e8eef5;background:#fff;padding:8px 10px;text-align:left}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ddebff;color:var(--blue);font-weight:900}.copy{min-width:0}.copy strong,.copy span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy strong{font-size:12px}.copy span{font-size:10px;color:var(--muted);margin-top:2px}.badge{min-width:20px;height:20px;border-radius:999px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:900}.empty{padding:28px 15px;text-align:center;color:var(--muted);font-size:12px}.chat{display:none;flex:1;min-height:0;flex-direction:column}.chat.on{display:flex}.chathead{height:55px;display:flex;align-items:center;gap:8px;padding:7px 10px;background:#fff;border-bottom:1px solid var(--line)}.back{border:0;background:transparent;font-size:22px}.messages{flex:1;overflow:auto;padding:12px;background:#f7fbff}.line{display:flex;margin:5px 0}.line.mine{justify-content:flex-end}.bubble{max-width:78%;padding:8px 10px;border:1px solid var(--line);background:#fff;border-radius:13px;font-size:12px}.mine .bubble{background:#ddecfb;border-color:#ddecfb}.composer{display:grid;grid-template-columns:1fr auto;gap:7px;padding:8px;background:#fff;border-top:1px solid var(--line)}.composer textarea{height:40px;resize:none;border:1px solid var(--line);border-radius:18px;padding:9px 12px}.send{width:40px;height:40px;border:0;border-radius:50%;background:var(--blue);color:#fff}.hidden{display:none!important}@media(min-width:760px){.shell{display:grid;grid-template-columns:92px 340px 1fr;grid-template-rows:58px 1fr}.top{grid-column:2/4}.tabs{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;padding-top:65px;background:#0b3158}.tab{background:transparent;color:#d9e8f6;height:72px}.tab.active{color:#fff;background:#1b70d3;border:0}.home{grid-column:2;grid-row:2;border-right:1px solid var(--line);min-height:0;display:flex;flex-direction:column}.chat{grid-column:3;grid-row:2}.chat.on{display:flex}.close{color:var(--ink)}}</style></head><body><div class="shell"><header class="top"><span>💬</span><strong>Mensajería</strong><small>MNS v0.5.12</small><button class="close" id="exit">×</button></header><nav class="tabs"><button class="tab" id="system">🔔<br>SISTEMA</button><button class="tab active" id="attention">🎧<br>ATENCIÓN</button><button class="tab" id="contacts">👥<br>CONTACTOS</button></nav><section class="home" id="home"><div class="toolbar"><input id="search" type="search" placeholder="Buscar en conversaciones..."></div><div class="list" id="list"><div class="empty">Cargando Mensajería…</div></div></section><section class="chat" id="chat"><div class="chathead"><button class="back" id="back">←</button><div><strong id="chatTitle">Conversación</strong></div></div><div class="messages" id="messages"></div><div class="composer" id="composer"><textarea id="text" placeholder="Escribe un mensaje"></textarea><button class="send" id="send">➤</button></div></section></div><script>(()=>{'use strict';const CHANNEL='MNS_FRONTEND',VERSION='0.5.12',pending=new Map(),state={context:null,session:null,items:[],active:null,messages:[]};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`;function req(action,payload={}){return new Promise((resolve,reject)=>{const id=uid(),timer=setTimeout(()=>{pending.delete(id);reject(new Error('No hubo respuesta de MNS.'))},15000);pending.set(id,{resolve,reject,timer});parent.postMessage({channel:CHANNEL,id,action,payload},location.origin)})}function map(c){return{_id:c._id,tipo:c.tipo,titulo:c.tipo==='USUARIO_ADMIN'?'Atención':c.tipo==='SISTEMA_USUARIO'?'Sistema':c.titulo||'Conversación',ultimoMensaje:c.ultimoMensaje||'',unread:Number(c.unread)||0}}function render(){const q=$('search').value.trim().toLowerCase();const a=state.items.filter(x=>!q||x.titulo.toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(c=>`<button class="row" data-id="${esc(c._id)}"><div class="avatar">${c.tipo==='SISTEMA_USUARIO'?'🔔':c.tipo==='USUARIO_ADMIN'?'🎧':'👤'}</div><div class="copy"><strong>${esc(c.titulo)}</strong><span>${esc(c.ultimoMensaje||'Sin mensajes')}</span></div>${c.unread?`<span class="badge">${c.unread}</span>`:'<span>›</span>'}</button>`).join(''):'<div class="empty">Sin conversaciones.</div>'}async function base(){const c=state.context;const [init,inbox]=await Promise.all([req('mnsInit',{appId:c.appId,eoId:c.eoId}),req('mnsGetInbox',{appId:c.appId,eoId:c.eoId})]);state.session=init;state.items=(inbox.items||[]).map(map);render()}async function special(kind){try{const c=state.context,r=await req(kind==='ADMIN'?'mnsOpenAdmin':'mnsOpenSystem',{appId:c.appId,eoId:c.eoId}),conv=map(r.conversation);if(!state.items.some(x=>x._id===conv._id))state.items.unshift(conv);open(conv)}catch(e){alert(e.message)}}async function open(c){state.active=c;$('chatTitle').textContent=c.titulo;$('chat').classList.add('on');$('composer').classList.toggle('hidden',c.tipo==='SISTEMA_USUARIO');try{const r=await req('mnsGetMessages',{conversationId:c._id,offset:0,limit:100});state.messages=r.messages||[];renderMessages();req('mnsMarkConversationRead',{conversationId:c._id}).catch(()=>{})}catch(e){$('messages').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}function renderMessages(){$('messages').innerHTML=state.messages.map(m=>`<div class="line ${m.propio?'mine':''}"><div class="bubble">${esc(m.texto)}</div></div>`).join('')||'<div class="empty">Sin mensajes.</div>';$('messages').scrollTop=$('messages').scrollHeight}async function send(){const t=$('text').value.trim();if(!t||!state.active)return;try{await req('mnsSendMessage',{conversationId:state.active._id,texto:t,operationId:uid()});$('text').value='';await open(state.active)}catch(e){alert(e.message)}}$('search').oninput=render;$('attention').onclick=()=>special('ADMIN');$('system').onclick=()=>special('SYSTEM');$('contacts').onclick=()=>alert('Contactos se cargan desde MNS al iniciar una conversación.');$('back').onclick=()=>$('chat').classList.remove('on');$('exit').onclick=()=>{if($('chat').classList.contains('on'))$('chat').classList.remove('on');else parent.postMessage({channel:CHANNEL,type:'CLOSE'},location.origin)};$('send').onclick=send;$('text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};document.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b){const c=state.items.find(x=>x._id===b.dataset.id);if(c)open(c)}});addEventListener('message',async e=>{if(e.origin!==location.origin||e.source!==parent)return;const m=e.data;if(!m||m.channel!==CHANNEL)return;if(m.type==='CONTEXT'){state.context=m.payload;try{await base()}catch(err){$('list').innerHTML=`<div class="empty">${esc(err.message)}</div>`}return}if(m.id&&pending.has(m.id)){const p=pending.get(m.id);clearTimeout(p.timer);pending.delete(m.id);m.ok?p.resolve(m.data):p.reject(new Error(m.error||'Error MNS'))}});parent.postMessage({channel:CHANNEL,type:'READY',version:VERSION},location.origin)})();</script></body></html>
